server.port=8080

# Where the Python model service runs (see ml-service/README)
ml.service.url=http://localhost:8000

# H2 database stored in ./data/creditrisk.mv.db
spring.datasource.url=jdbc:h2:file:./data/creditrisk
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Browse the database with SQL at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/creditrisk, user: sa, empty password)
spring.h2.console.enabled=true
